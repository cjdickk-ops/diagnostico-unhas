<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico Interativo de Unhas</title>
<meta name="description" content="Diagnóstico do seu perfil de unha, plano de ação de 21 dias e respostas da especialista.">
<meta name="theme-color" content="#C87560">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diagnóstico Unhas">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C87560'/%3E%3Cpath d='M32 14c-7 0-11 6-11 14v16c0 4 3 6 6 6h10c3 0 6-2 6-6V28c0-8-4-14-11-14z' fill='none' stroke='%23F9F6F0' stroke-width='3'/%3E%3Cpath d='M25 24c2-3 4-4 7-4s5 1 7 4' fill='none' stroke='%23F9F6F0' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --areia: #F9F6F0;
  --branco: #FFFFFF;
  --terracota: #C87560;
  --terracota-escuro: #A85C49;
  --terracota-suave: #F3E3DC;
  --nude: #E8DFD5;
  --nude-escuro: #D6C9BB;
  --grafite: #2C2A29;
  --grafite-suave: #6B6561;
  --linha: #ECE5DC;
  --sucesso: #7E8F6A;
  --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
  --sans: 'Montserrat', 'Lato', -apple-system, 'Segoe UI', sans-serif;
  --raio: 18px;
  --sombra: 0 1px 2px rgba(44,42,41,.04), 0 8px 24px rgba(44,42,41,.06);
  --nav-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: #EFEAE2;
  color: var(--grafite);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
.app {
  position: relative;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--areia);
  box-shadow: 0 0 60px rgba(44,42,41,.08);
}
.view { display: none; padding: 0 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom)); }
.view.ativa { display: block; animation: surgir .35s ease; }
@keyframes surgir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Cabeçalho */
.topo {
  padding: calc(22px + env(safe-area-inset-top)) 4px 14px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.topo .marca { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--terracota); font-weight: 600; }
.topo h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.1; margin: 4px 0 0; }

/* Tipografia */
h2, h3, h4 { font-family: var(--serif); font-weight: 600; color: var(--grafite); }
h2 { font-size: 28px; line-height: 1.15; margin: 0 0 12px; }
h3 { font-size: 21px; line-height: 1.25; margin: 22px 0 8px; }
h4 { font-size: 18px; margin: 16px 0 6px; }
p { margin: 0 0 12px; }
.sobretitulo { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--terracota); font-weight: 600; margin-bottom: 6px; }
.suave { color: var(--grafite-suave); }
.pequeno { font-size: 13px; }

/* Cartões */
.cartao {
  background: var(--branco);
  border-radius: var(--raio);
  padding: 22px 20px;
  margin: 0 0 16px;
  box-shadow: var(--sombra);
}
.cartao > :first-child { margin-top: 0; }
.cartao > :last-child { margin-bottom: 0; }
.cartao.destaque { background: var(--terracota); color: #fff; }
.cartao.destaque h2, .cartao.destaque h3, .cartao.destaque h4 { color: #fff; }
.cartao.nude { background: var(--nude); box-shadow: none; }
.cartao.alerta { border: 1.5px solid var(--terracota); }
.md ul, .md ol { padding-left: 20px; margin: 0 0 12px; }
.md li { margin: 0 0 6px; }
.md li::marker { color: var(--terracota); }
.md h3:first-child { margin-top: 0; }
.md .rotulo { font-weight: 600; margin-bottom: 6px; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; padding: 14px 22px;
  border: 0; border-radius: 999px;
  background: var(--terracota); color: #fff;
  font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  transition: background .2s, transform .1s;
}
.btn:hover { background: var(--terracota-escuro); }
.btn:active { transform: scale(.98); }
.btn:disabled { background: var(--nude-escuro); cursor: not-allowed; }
[hidden] { display: none !important; }
.btn.secundario { background: transparent; color: var(--terracota); border: 1.5px solid var(--terracota); }
.btn.secundario:hover { background: var(--terracota-suave); }
.btn.claro { background: #fff; color: var(--terracota); }
.link-discreto {
  background: none; border: 0; padding: 10px; color: var(--grafite-suave);
  font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
}
.voltar {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; padding: 6px 0; color: var(--grafite-suave); font-size: 13px; font-weight: 500;
}
.voltar svg { width: 16px; height: 16px; }

/* Ecrã de boas-vindas */
.hero {
  position: relative; overflow: hidden;
  background: var(--nude); border-radius: 26px;
  padding: 34px 24px 28px; margin-bottom: 16px;
}
.hero h2 { font-size: 34px; }
.hero .ornamento { position: absolute; right: -30px; top: -30px; width: 170px; height: 170px; opacity: .55; }
.lista-icone { list-style: none; padding: 0; margin: 14px 0 0; }
.lista-icone li { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.lista-icone li svg { flex: 0 0 22px; width: 22px; height: 22px; color: var(--terracota); margin-top: 1px; }

/* Barra de progresso do questionário */
.progresso-q { position: sticky; top: 0; z-index: 5; background: var(--areia); padding: calc(14px + env(safe-area-inset-top)) 4px 12px; }
.progresso-q .linha-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.progresso-q .contador { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--grafite-suave); font-weight: 600; }
.barra { height: 6px; background: var(--nude); border-radius: 999px; overflow: hidden; }
.barra > span { display: block; height: 100%; width: 0; background: var(--terracota); border-radius: 999px; transition: width .45s cubic-bezier(.2,.8,.2,1); }

/* Opções */
.opcoes { display: grid; gap: 10px; margin-top: 18px; }
.opcao {
  display: flex; gap: 14px; align-items: flex-start; text-align: left;
  width: 100%; padding: 16px; border-radius: 16px;
  background: var(--branco); border: 1.5px solid var(--linha);
  transition: border-color .2s, background .2s;
  line-height: 1.5;
}
.opcao:hover { border-color: var(--nude-escuro); }
.opcao .marcador {
  flex: 0 0 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--nude-escuro);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600; color: var(--grafite-suave); text-transform: uppercase;
}
.opcao.multi .marcador { border-radius: 8px; }
.opcao.sel { border-color: var(--terracota); background: var(--terracota-suave); }
.opcao.sel .marcador { background: var(--terracota); border-color: var(--terracota); color: #fff; }
.opcao.sel .marcador svg { width: 14px; height: 14px; }
.ajuda { display: flex; gap: 10px; padding: 12px 14px; background: var(--nude); border-radius: 12px; font-size: 13px; margin-top: 10px; }
.ajuda svg { flex: 0 0 18px; width: 18px; height: 18px; color: var(--terracota); margin-top: 1px; }

/* Análise */
.analise { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 40px 10px; }
.anel-carregar { width: 72px; height: 72px; margin: 0 auto 24px; }
.anel-carregar circle { fill: none; stroke-width: 3; }
.anel-carregar .fundo { stroke: var(--nude); }
.anel-carregar .frente { stroke: var(--terracota); stroke-linecap: round; stroke-dasharray: 60 200; transform-origin: center; animation: girar 1.1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Resultado */
.perfil-hero { background: var(--terracota); color: #fff; border-radius: 26px; padding: 28px 22px 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
.perfil-hero .sobretitulo { color: rgba(255,255,255,.8); }
.perfil-hero h2 { color: #fff; font-size: 36px; margin-bottom: 4px; }
.perfil-hero .letra { position: absolute; right: 18px; top: 4px; font-family: var(--serif); font-size: 130px; line-height: 1; opacity: .14; font-weight: 700; }
.perfil-hero .secundario { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 12px; font-weight: 500; }
.pontuacoes { display: grid; gap: 8px; margin-top: 20px; }
.pontuacao { display: grid; grid-template-columns: 112px 1fr 28px; align-items: center; gap: 10px; font-size: 12px; }
.pontuacao .trilho { height: 6px; background: rgba(255,255,255,.22); border-radius: 999px; overflow: hidden; }
.pontuacao .trilho span { display: block; height: 100%; background: #fff; border-radius: 999px; }
.pontuacao .valor { text-align: right; font-weight: 600; }

.seccao-titulo { display: flex; align-items: center; gap: 10px; margin: 30px 4px 12px; }
.seccao-titulo svg { width: 22px; height: 22px; color: var(--terracota); flex: 0 0 22px; }
.seccao-titulo h2 { margin: 0; font-size: 26px; }

/* Plano */
.progresso-plano {
  position: sticky; top: 0; z-index: 6;
  background: var(--areia);
  padding: calc(10px + env(safe-area-inset-top)) 4px 12px;
  margin: 0 -4px;
}
.progresso-plano .linha-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.progresso-plano strong { font-family: var(--serif); font-size: 26px; color: var(--terracota); }
.separadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--nude); padding: 5px; border-radius: 999px; margin: 6px 0 16px; }
.separadores button { border: 0; background: transparent; padding: 10px 6px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--grafite-suave); }
.separadores button.ativo { background: var(--branco); color: var(--terracota); box-shadow: 0 2px 8px rgba(44,42,41,.08); }
.semana-cab .sobretitulo { margin-top: 2px; }
.rotina-ref { border-top: 1px solid var(--linha); padding-top: 12px; margin-top: 12px; }
.rotina-ref h4 { font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracota); margin: 14px 0 6px; font-weight: 600; }
.rotina-ref ul { padding-left: 18px; margin: 0; }
.rotina-ref li { margin-bottom: 4px; font-size: 14px; }

/* Acordeões */
.acordeao { background: var(--branco); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--sombra); overflow: hidden; }
.acordeao > summary, .acordeao-cab {
  list-style: none; display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; cursor: pointer; user-select: none;
}
.acordeao > summary::-webkit-details-marker { display: none; }
.acordeao .seta { margin-left: auto; width: 18px; height: 18px; color: var(--grafite-suave); transition: transform .25s; flex: 0 0 18px; }
.acordeao[open] .seta { transform: rotate(180deg); }
.acordeao .corpo { padding: 0 18px 18px; }
.dia-num {
  flex: 0 0 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; text-align: center;
  background: var(--nude); font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1;
}
.dia-num small { display: block; font-family: var(--sans); font-size: 8px; letter-spacing: .14em; font-weight: 600; text-transform: uppercase; margin-bottom: -6px; }
.dia-num.completo { background: var(--terracota); color: #fff; }
.dia-num.parcial { background: var(--terracota-suave); color: var(--terracota-escuro); }
.dia-info { min-width: 0; }
.dia-info .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.dia-info .s { font-size: 12px; color: var(--grafite-suave); }
.selo-hoje { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--terracota); color: #fff; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; vertical-align: 2px; }

/* Checklist */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--linha); cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .caixa {
  flex: 0 0 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--nude-escuro);
  display: grid; place-items: center; margin-top: 1px; transition: background .2s, border-color .2s;
}
.check .caixa svg { width: 14px; height: 14px; color: #fff; opacity: 0; transition: opacity .2s; }
.check input:checked + .caixa { background: var(--terracota); border-color: var(--terracota); }
.check input:checked + .caixa svg { opacity: 1; }
.check input:focus-visible + .caixa { outline: 2px solid var(--terracota); outline-offset: 2px; }
.check .txt { flex: 1; min-width: 0; }
.check .txt .t { font-weight: 600; font-size: 14px; }
.check .txt ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--grafite-suave); }
.check .txt li { margin-bottom: 4px; }
.check input:checked ~ .txt .t { text-decoration: line-through; text-decoration-color: var(--nude-escuro); color: var(--grafite-suave); }
.etiqueta-tarefa { display: inline-block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--terracota); margin-bottom: 2px; }
.notas-dia { margin-top: 12px; }
.notas-dia label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--grafite-suave); font-weight: 600; margin-bottom: 6px; }
textarea {
  width: 100%; min-height: 84px; padding: 12px 14px; resize: vertical;
  border: 1.5px solid var(--linha); border-radius: 12px; background: var(--areia);
  line-height: 1.5;
}
textarea:focus, input[type=search]:focus { outline: none; border-color: var(--terracota); }
.guardado { font-size: 11px; color: var(--sucesso); height: 14px; margin-top: 4px; transition: opacity .3s; }

/* Progresso */
.anel-wrap { display: flex; align-items: center; gap: 20px; }
.anel { width: 128px; height: 128px; flex: 0 0 128px; position: relative; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel circle { fill: none; stroke-width: 9; }
.anel .fundo { stroke: var(--nude); }
.anel .frente { stroke: var(--terracota); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
.anel .centro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.anel .centro strong { font-family: var(--serif); font-size: 34px; line-height: 1; display: block; }
.anel .centro span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--grafite-suave); }
.metricas { display: grid; gap: 10px; flex: 1; }
.metrica .n { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.1; }
.metrica .l { font-size: 12px; color: var(--grafite-suave); }
.grelha { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.grelha button {
  aspect-ratio: 1; border-radius: 12px; border: 0; background: var(--nude);
  font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--grafite);
  position: relative;
}
.grelha button.parcial { background: var(--terracota-suave); color: var(--terracota-escuro); }
.grelha button.completo { background: var(--terracota); color: #fff; }
.grelha button.hoje { box-shadow: 0 0 0 2px var(--areia), 0 0 0 4px var(--grafite); }
.grelha .rotulo-semana { grid-column: 1 / -1; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--grafite-suave); font-weight: 600; margin-top: 6px; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--grafite-suave); margin-top: 14px; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.barras-semana { display: grid; gap: 12px; }
.barra-semana .cab { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.barra-semana .cab strong { font-weight: 600; }

/* Folha (bottom sheet) */
.veu { position: fixed; inset: 0; background: rgba(44,42,41,.4); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.veu.aberto { opacity: 1; pointer-events: auto; }
.folha {
  position: fixed; left: 50%; bottom: 0; z-index: 41;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  background: var(--areia); border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.folha.aberta { transform: translate(-50%, 0); }
.folha .pega { width: 40px; height: 4px; border-radius: 999px; background: var(--nude-escuro); margin: 4px auto 14px; }
.folha .fechar { position: absolute; right: 14px; top: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--nude); display: grid; place-items: center; }
.folha .fechar svg { width: 16px; height: 16px; }

/* Pesquisa */
.pesquisa { position: sticky; top: 0; z-index: 5; background: var(--areia); padding: 4px 0 10px; }
.campo-pesquisa { position: relative; }
.campo-pesquisa svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--grafite-suave); pointer-events: none; }
.campo-pesquisa input {
  width: 100%; height: 52px; padding: 0 44px 0 46px;
  border: 1.5px solid var(--linha); border-radius: 999px; background: var(--branco);
  font-size: 15px; -webkit-appearance: none; appearance: none;
}
.campo-pesquisa input::-webkit-search-cancel-button { display: none; }
.limpar { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--nude); display: none; place-items: center; }
.limpar.visivel { display: grid; }
.limpar svg { position: static; transform: none; width: 14px; height: 14px; color: var(--grafite); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1.5px solid var(--nude-escuro); background: transparent; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--grafite); }
.chip.ativo { background: var(--grafite); border-color: var(--grafite); color: #fff; }
.contagem { font-size: 12px; color: var(--grafite-suave); margin: 8px 4px 12px; }
.faq .cat { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracota); font-weight: 600; }
.faq .perg { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
.faq .resposta p { font-size: 14.5px; }
.faq .resposta ul { padding-left: 18px; }
.faq .assinatura { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-top: 4px; }
.faq .assinatura .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--nude); display: grid; place-items: center; color: var(--terracota); flex: 0 0 32px; }
.faq .assinatura .avatar svg { width: 16px; height: 16px; }
.faq .assinatura span { font-size: 12px; color: var(--grafite-suave); }
.faq .assinatura strong { display: block; font-size: 13px; color: var(--grafite); }
.aviso-medico { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--terracota-suave); color: var(--terracota-escuro); font-size: 13px; font-weight: 500; margin-top: 4px; }
.aviso-medico svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tags span { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--areia); color: var(--grafite-suave); }
mark { background: var(--terracota-suave); color: inherit; border-radius: 3px; padding: 0 2px; }
.vazio { text-align: center; padding: 40px 20px; }
.vazio svg { width: 48px; height: 48px; color: var(--nude-escuro); margin-bottom: 12px; }

/* Navegação inferior */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(255,255,255,.94);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--linha);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav button {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border: 0; background: none; padding: 8px 4px; border-radius: 14px;
  color: var(--grafite-suave); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; line-height: 1.2;
  min-height: 56px;
}
.nav button svg { width: 24px; height: 24px; }
.nav button.ativo { color: var(--terracota); }
.nav button.ativo .icone-fundo { background: var(--terracota-suave); }
.icone-fundo { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s; }

.banner-instalar:empty { display: none; }
.acoes-instalar { display: grid; gap: 4px; justify-items: center; }
.nota-legal { font-size: 11.5px; color: var(--grafite-suave); text-align: center; padding: 8px 12px 0; line-height: 1.5; }
.centro { text-align: center; }
.mt { margin-top: 16px; }
.comparacao { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 4px; }
.comparacao th, .comparacao td { padding: 9px 6px; border-bottom: 1px solid var(--linha); text-align: left; }
.comparacao th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--grafite-suave); font-weight: 600; }
.comparacao td.n { text-align: right; font-weight: 600; }
.bloqueado { display: flex; gap: 12px; align-items: center; color: var(--grafite-suave); font-size: 13.5px; }
.bloqueado svg { width: 22px; height: 22px; flex: 0 0 22px; color: var(--nude-escuro); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

                             "nome":  "Unha Quebradiça",
                             "laudo":  "**O seu perfil: Unha Quebradiça**\n\n**O que identificámos/identificamos**\n\nAs suas respostas indicam unhas que perderam a capacidade de absorver impactos. Partem, racham ou lascam com facilidade, muitas vezes de forma irregular, e raramente conseguem passar de um determinado comprimento.\n\n**O que está a acontecer**\n\nA unha quebradiça é rígida em vez de flexível. Quando sofre um impacto, em vez de dobrar ligeiramente, fratura. Na maioria dos casos, a causa principal é um mecanismo pouco conhecido: o ciclo de hidratação e desidratação. Sempre que a unha fica em água, absorve-a e expande. Ao secar, contrai. Repetido várias vezes por dia, durante meses, este ciclo enfraquece as ligações entre as células da unha, tal como um clipe metálico dobrado repetidamente acaba por partir. Os detergentes agravam o processo, ao remover os lípidos que protegem a unha.\n\n**Origem provável**\n\nPredominantemente externa: contacto/contato frequente com água e detergentes sem luvas, lixagem em vaivém, uso das unhas como ferramenta e solventes agressivos.\n\n**Sobre a matriz e a saúde geral**\n\nSe as suas unhas já nascem finas e frágeis desde a base, se a alteração surgiu de forma súbita, ou se a acompanha cansaço, queda de cabelo ou palidez, fale com o seu médico. Algumas carências nutricionais, como a de ferro, e alterações da tiroide/tireoide podem manifestar-se nas unhas. Não é o cenário mais frequente, mas não deve ser ignorado.\n\n**Prognóstico para 21 dias**\n\nAo fim de uma semana, com luvas e unhas curtas, é esperado que as quebras diminuam de forma marcada. Ao fim de duas, as pontas devem estar lisas e sem fissuras novas. Ao fim de três, a unha deve estar mais flexível ao toque, e a nova unha junto à cutícula a crescer protegida.\n\n**Nível de prioridade do plano:** Eliminar o ciclo de molhar e secar, e devolver flexibilidade.",
                             "kit":  "**Os seus produtos**\n\nEssenciais:\n\n1. **Luvas de borracha forradas a algodão**, no tamanho certo. Em caso de alergia ao látex, de nitrilo. Este é o produto mais importante do seu plano.\n\n2. **Lixa/lima de vidro (ou de cristal).** Sela a ponta da unha em vez de a desfiar e evita as microfissuras que dão origem às quebras.\n\n3. **Corta-unhas ou tesoura de ponta curva** de aço inoxidável, bem afiados.\n\n4. **Óleo de cutículas**, preferencialmente de jojoba ou amêndoas doces, em frasco e em caneta.\n\n5. **Creme de mãos** com glicerina e um ingrediente oclusivo (karité, vaselina, dimeticona).\n\n6. **Base flexível ou hidratante**, sem formaldeído.\n\n7. **Removedor sem acetona**, com óleos.\n\nComplementares:\n\n8. Luvas de algodão para a noite.\n\n9. Uma lixa/lima de vidro pequena para levar na mala/bolsa.",
                             "regras":  "**O que deve evitar a todo o custo durante os 21 dias**\n\n- Qualquer contacto/contato com detergentes ou produtos de limpeza sem luvas. Sem exceções.\n- Lixar/limar em vaivém. Sempre num único sentido.\n- Usar as unhas como ferramenta: abrir latas, raspar etiquetas, descolar fita-cola/fita adesiva. Use a polpa dos dedos ou um objeto.\n- Bases \"endurecedoras\" ou \"fortalecedoras\" com formaldeído. Numa unha quebradiça, aumentam a rigidez e agravam as quebras.\n- Deixar as unhas compridas durante o plano.\n- Banhos muito longos ou mãos em água durante muito tempo.\n- Arrancar uma unha partida ou uma lasca com os dedos ou com os dentes.\n- Cortar as unhas quando estão completamente secas e rígidas.",

                             "laudo":  "**O seu perfil: Unha que Descama**\n\n**O que identificámos/identificamos**\n\nAs suas respostas indicam que a ponta das suas unhas se está a separar em camadas finas e horizontais. É provável que as pontas prendam na roupa ou no cabelo e que o verniz/esmalte lasque em poucos dias, porque a camada da unha por baixo dele se solta.\n\n**O que está a acontecer**\n\nA unha é formada por camadas finíssimas de queratina, sobrepostas como as folhas de um livro fechado e unidas por uma combinação de água e lípidos. Na unha que descama, esse elemento de ligação foi sendo dissolvido. As folhas começaram a descolar, a partir da ponta, que é a parte mais antiga e mais exposta da unha.\n\n**Origem provável**\n\nPredominantemente externa: exposição repetida à água, detergentes e removedores com acetona/dissolvente, que dissolvem os lípidos entre as camadas; lixagem em vaivém, que abre as camadas em leque; e o hábito de arrancar o verniz/esmalte, que leva consigo camadas superficiais da unha.\n\n**Uma boa notícia**\n\nSe a descamação se limita à ponta e a unha junto à cutícula parece normal, a matriz, a estrutura que produz a unha, está a funcionar bem. A unha nasce íntegra e é danificada ao longo do percurso. Isto torna o seu perfil um dos mais rápidos de corrigir: basta proteger a unha nova que está a crescer.\n\n**Sobre a hidratação**\n\nA carência é sobretudo lipídica, mais do que de água. Os óleos são, no seu caso, mais determinantes do que os cremes.\n\n**Prognóstico para 21 dias**\n\nAo fim de uma semana, com a lixagem correta e óleo na ponta, é esperado que a borda da unha esteja visivelmente mais compacta e lisa ao toque. Ao fim de duas, que o verniz/esmalte dure mais tempo sem lascar. Ao fim de três, que a unha nova esteja a crescer sem camadas e que a porção descamada esteja quase toda cortada.\n\n**Nível de prioridade do plano:** Selar a ponta da unha e repor os lípidos entre as camadas.",
                             "kit":  "**Os seus produtos**\n\nEssenciais:\n\n1. **Lixa/lima de vidro (ou de cristal).** É o produto mais importante do seu plano. O seu grão muito fino e uniforme sela as camadas na ponta, em vez de as abrir.\n\n2. **Óleo de cutículas de jojoba**, ou mistura de jojoba e amêndoas doces, em frasco com pincel. Vai aplicá-lo diretamente na ponta da unha, não só na cutícula.\n\n3. **Corta-unhas ou tesoura de ponta curva**, bem afiados, para cortar a porção descamada.\n\n4. **Luvas de borracha forradas a algodão.**\n\n5. **Removedor sem acetona**, com óleos ou glicerina, e discos de algodão.\n\n6. **Base seladora ou niveladora**, sem formaldeído.\n\n7. **Top coat.**\n\n8. **Creme de mãos** com glicerina e um ingrediente oclusivo.\n\nComplementares:\n\n9. Luvas de algodão para a noite.\n\n10. Álcool ou desengordurante de unhas, para preparar a superfície antes da base.",
                             "regras":  "**O que deve evitar a todo o custo durante os 21 dias**\n\n- Lixar/limar em vaivém. Sempre num único sentido, da lateral para o centro.\n- Lixas/limas metálicas ou de grão grosso (inferior a 180).\n- Removedor com acetona/dissolvente.\n- Esfregar o algodão com removedor em vaivém sobre a unha.\n- Arrancar o verniz/esmalte, ou puxar camadas soltas da unha com os dedos ou com os dentes.\n- Lavar a louça ou fazer limpezas sem luvas.\n- Imersões longas das mãos em água, incluindo a tigela de água na manicure.\n- Bloco polidor, que retira ainda mais camadas.\n- Deixar as unhas compridas enquanto a ponta está descamada.",

                             "nome":  "Unha Enfraquecida",
                             "laudo":  "**O seu perfil: Unha Enfraquecida**\n\n**O que identificámos/identificamos**\n\nAs suas respostas indicam unhas finas e com pouca estrutura. Dobram com facilidade, podem rasgar ou dobrar para trás, e é possível que estejam sensíveis ao toque ou à temperatura. É frequente que este perfil surja depois de um período de verniz gel/esmalte em gel, gelinho/banho de gel, gel moldado ou acrílico, ou de cuticulagem/remoção de cutículas excessiva.\n\n**O que está a acontecer**\n\nExistem dois cenários possíveis, e é importante perceber qual se aplica a si.\n\nNo cenário mais comum, a unha foi desgastada. Nasceu com espessura normal, mas perdeu camadas por lixagem da superfície ou por uma remoção forçada de produtos artificiais. O sinal característico é uma unha mais espessa e firme junto à cutícula do que na ponta. Neste caso, a recuperação é completa à medida que a unha cresce.\n\nNo segundo cenário, a unha já nasce fina, de forma uniforme, em vários dedos. A matriz, a estrutura que produz a unha, está a fabricar uma unha com menos estrutura. As causas podem incluir mãos constantemente húmidas/úmidas, uma alimentação restritiva ou com pouca proteína, agressões repetidas à zona da cutícula ou alterações de saúde que devem ser avaliadas por um médico.\n\n**Sobre a hidratação**\n\nAo contrário da unha seca, a unha enfraquecida tem, muitas vezes, água a mais e estrutura a menos. Imersões prolongadas tornam-na ainda mais mole. Por isso, o seu plano evita imersões e privilegia proteção e óleo em quantidade moderada.\n\n**Sobre a matriz**\n\nA matriz precisa de matéria-prima para produzir uma unha forte. Uma alimentação com proteína suficiente em todas as refeições, fontes de ferro e variedade de alimentos faz diferença, ao ritmo do crescimento. Se a sua alimentação é muito restritiva, ou se a unha nasce fina em todos os dedos, fale com o seu médico antes de recorrer a suplementos: eles só têm efeito relevante quando existe uma carência confirmada.\n\n**Prognóstico para 21 dias**\n\nEste é o perfil que exige mais paciência, e é importante ser honesta consigo: em 21 dias, a unha danificada não vai ficar espessa. O que vai acontecer é que, com as unhas curtas e protegidas, as roturas/rupturas param; a sensibilidade diminui; e começam a nascer cerca de 2 milímetros de unha nova, visivelmente mais firme, junto à cutícula. É esse o sinal de que o plano está a funcionar. A recuperação completa acontece entre 4 e 6 meses, à medida que a unha nova substitui a antiga.\n\n**Nível de prioridade do plano:** Proteger a unha existente e criar as condições para que a unha nova nasça forte.",
                             "kit":  "**Os seus produtos**\n\nEssenciais:\n\n1. **Corta-unhas ou tesoura de ponta curva** de aço inoxidável, bem afiados. O seu primeiro instrumento de tratamento é o comprimento curto.\n\n2. **Base fortalecedora sem formaldeído** (confirme no rótulo a ausência de formaldehyde ou formalin). Vai funcionar como uma \"armadura\" para a unha fina.\n\n3. **Top coat.**\n\n4. **Lixa/lima de grão 240 ou superior**, ou de vidro. A mais suave possível.\n\n5. **Óleo de cutículas de jojoba.**\n\n6. **Empurrador de cutículas com ponta de silicone ou borracha**, ou palito de laranjeira envolvido em algodão.\n\n7. **Creme de mãos** com glicerina e um ingrediente oclusivo.\n\n8. **Removedor sem acetona**, com óleos.\n\n9. **Luvas de borracha forradas a algodão.**\n\nComplementares:\n\n10. Álcool ou desengordurante de unhas.\n\n11. Luvas de algodão para a noite.",
                             "regras":  "**O que deve evitar a todo o custo durante os 21 dias**\n\n- Aplicar verniz gel/esmalte em gel, gelinho/banho de gel, gel moldado ou acrílico. A unha precisa de recuperar antes de voltar a receber produtos que exigem preparação e remoção agressivas.\n- Lixar/limar a superfície da unha para a \"uniformizar\" ou tirar marcas. Cada passagem retira espessura que a unha não tem.\n- Bloco polidor, por qualquer razão.\n- Imersões das mãos ou dos dedos em água, incluindo a tigela de água da manicure tradicional e banhos de óleo prolongados.\n- Endurecedores com formaldeído. Dão rigidez rápida, mas a longo prazo fragilizam a unha e podem irritar a pele.\n- Cortar as cutículas ou empurrá-las com força. A zona da cutícula protege a matriz, e é dela que depende a unha nova.\n- Deixar as unhas crescer durante o plano.\n- Usar as unhas para abrir, raspar ou descolar.",

                       "DB":  "**O seu perfil secundário: Unha Quebradiça**\n\nA sua unha é fina e, em algumas zonas, rígida. Ao seu plano, acrescente: lixa/lima de vidro e verificação diária das pontas. Se a base fortalecedora tornar a unha mais rígida ou propensa a estalar, substitua-a por uma base flexível.",

                    "resposta":  "Na maioria dos casos, o problema está na preparação, não no produto. Três ajustes fazem uma diferença enorme.\n\nPrimeiro, desengordure a unha antes da base. Óleo, creme ou resíduos de removedor impedem a aderência. Passe um disco de algodão com álcool em cada unha, incluindo a ponta.\n\nSegundo, aplique camadas finas. Uma camada grossa seca por fora e fica mole por dentro, e acaba por estalar. Duas camadas finas duram muito mais.\n\nTerceiro, sele a ponta. No fim de cada camada, passe o pincel na horizontal ao longo da espessura da ponta da unha. É aí que começam quase todas as lascas.\n\nPara prolongar, reaplique uma camada fina de top coat a cada dois ou três dias e use luvas sempre que lavar a louça. Água quente e detergente são os maiores inimigos de uma manicure.",

const ICONE_APP_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
  + '<rect width="512" height="512" fill="#C87560"/>'
  + '<g fill="none" stroke="#F9F6F0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">'

const ICONE_APP_SVG_URL = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICONE_APP_SVG);

/** Converte o SVG do ícone num PNG em Base64 com o tamanho indicado. */
function svgParaPng(tamanho) {
  return new Promise((resolver, rejeitar) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = tamanho;
        canvas.getContext('2d').drawImage(img, 0, 0, tamanho, tamanho);
        resolver(canvas.toDataURL('image/png'));
      } catch (e) { rejeitar(e); }
    };
    img.onerror = rejeitar;
    img.src = ICONE_APP_SVG_URL;
  });
}

function definirLink(rel, href, extra = {}) {
  let el = document.head.querySelector(`link[rel="${rel}"]`);
  if (!el) { el = document.createElement('link'); el.rel = rel; document.head.appendChild(el); }
  el.href = href;
  for (const [k, v] of Object.entries(extra)) el.setAttribute(k, v);
  return el;
}

function definirMeta(nome, conteudo) {
  let el = document.head.querySelector(`meta[name="${nome}"]`);
  if (!el) { el = document.createElement('meta'); el.name = nome; document.head.appendChild(el); }
  el.content = conteudo;
}

  definirMeta('theme-color', '#C87560');

  definirMeta('apple-mobile-web-app-capable', 'yes');
  definirMeta('apple-mobile-web-app-status-bar-style', 'default');
  definirMeta('apple-mobile-web-app-title', 'Diagnóstico Unhas');

  const icones = [{ src: ICONE_APP_SVG_URL, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }];
  try {
    const [png180, png192, png512] = await Promise.all([180, 192, 512].map(svgParaPng));
    icones.unshift(
      { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any' },

  }

  // Um manifesto em data: URL não tem endereço próprio, por isso start_url e scope são absolutos
  if (!/^https?:$/.test(location.protocol)) return;

  definirLink('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifesto)));
}

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const normalizar = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/** Converte o texto estruturado (subconjunto de Markdown) em HTML. */
function md(texto) {
  const linhas = String(texto).split('\n');
  let html = '', lista = null;
  const fechar = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  for (const bruta of linhas) {
    const l = bruta.trim();
    if (!l) continue; // linhas vazias separam blocos, mas não interrompem uma lista
    let m;
    if ((m = l.match(/^- (.+)$/))) {
      if (lista !== 'ul') { fechar(); html += '<ul>'; lista = 'ul'; }
      html += `<li>${inline(m[1])}</li>`;
    } else if ((m = l.match(/^(\d+)\. (.+)$/))) {
      if (lista !== 'ol') { fechar(); html += `<ol start="${m[1]}">`; lista = 'ol'; }
      html += `<li>${inline(m[2])}</li>`;
    } else if ((m = l.match(/^\*\*([^*]+)\*\*$/))) {
      fechar(); html += `<h3>${esc(m[1])}</h3>`;
    } else if (/^[^.]{2,40}:$/.test(l)) {
      fechar(); html += `<p class="rotulo">${inline(l)}</p>`;
    } else {
      fechar(); html += `<p>${inline(l)}</p>`;
    }
  }
  fechar();
  return html;
}

/** Lê um ecrã com linhas "Título:", "Texto:" e "Botão:". */
function lerEcra(texto) {
  const r = { titulo: '', botao: '', corpo: [] };
  for (const l of String(texto).split('\n')) {
    if (l.startsWith('Título: ')) r.titulo = l.slice(8).trim();
    else if (l.startsWith('Botão: ')) r.botao = l.slice(7).trim();
    else if (l.startsWith('Texto: ')) r.corpo.push(l.slice(7).trim());
    else r.corpo.push(l);
  }
  return { titulo: r.titulo, botao: r.botao, html: md(r.corpo.join('\n')) };
}

/* ==========================================================================
   MOTOR DE DIAGNÓSTICO
   ========================================================================== */
function calcular(respostas) {
  const pontos = { A: 0, B: 0, C: 0, D: 0 };
  for (const q of DATA.perguntas) {
    const op = q.opcoes.find(o => o.id === respostas[q.id]);
    if (op) for (const p of PERFIS) pontos[p] += op.pontos[p] || 0;
  }
  // Perfil principal: maior pontuação; desempate pela ordem D > B > C > A
  let principal = null;
  for (const p of PRIORIDADE) if (principal === null || pontos[p] > pontos[principal]) principal = p;
  // Perfil secundário: segunda maior pontuação, se >= 4 (mesmo critério de desempate)
  let secundario = null;
  for (const p of PRIORIDADE) {
    if (p === principal || pontos[p] < 4) continue;
    if (secundario === null || pontos[p] > pontos[secundario]) secundario = p;
  }
  return { pontos, principal, secundario };
}

/* ==========================================================================
   PLANO: itens de checklist e progresso
   ========================================================================== */
function perfilAtual() { return estado.diagnostico ? DATA.perfis[estado.diagnostico.principal] : null; }
function semanaDoDia(dia) { return Math.min(2, Math.floor((dia - 1) / 7)); }
function tarefaDoDia(perfil, dia) { return perfil.semanas[semanaDoDia(dia)].tarefas.find(t => t.dia === dia) || null; }
function itensDoDia(perfil, dia) {
  const itens = ['manha', 'dia', 'noite'].map(k => `${dia}-${k}`);
  if (tarefaDoDia(perfil, dia)) itens.push(`${dia}-tarefa`);
  return itens;
}
function progressoDia(dia) {
  const perfil = perfilAtual();
  const itens = itensDoDia(perfil, dia);
  const feitos = itens.filter(k => estado.checks[k]).length;
  return { feitos, total: itens.length };
}
function progressoGeral(de = 1, ate = 21) {
  let feitos = 0, total = 0;
  for (let d = de; d <= ate; d++) { const p = progressoDia(d); feitos += p.feitos; total += p.total; }
  return { feitos, total, pct: total ? Math.round(feitos / total * 100) : 0 };
}
function diasCompletos() {
  let n = 0;
  for (let d = 1; d <= 21; d++) { const p = progressoDia(d); if (p.feitos === p.total) n++; }
  return n;
}
function diaAtual() {
  if (!estado.diagnostico) return 1;
  const inicio = new Date(estado.diagnostico.data);
  const hoje = new Date(hojeISO());
  const dif = Math.floor((hoje - inicio) / 86400000);
  return Math.max(1, Math.min(21, dif + 1));
}
function diasDesdeInicio() {
  if (!estado.diagnostico) return 0;
  return Math.floor((new Date(hojeISO()) - new Date(estado.diagnostico.data)) / 86400000) + 1;
}

    ${cabecalhoFluxo(`Pergunta ${fluxo.qi + 1} de ${total}`, (fluxo.qi + (sel ? 1 : 0)) / total, podeVoltar)}
    <div class="sobretitulo mt">${fluxo.modo === 'reavaliacao' ? 'Reavaliação · ' : ''}${esc(q.id)} · ${esc(q.tema)}</div>
    <h2>${esc(q.pergunta)}</h2>
    ${q.ajuda ? `<div class="ajuda">${ICONE.luz}<span>${esc(q.ajuda)}</span></div>` : ''}
    <div class="opcoes" role="radiogroup" aria-label="${esc(q.pergunta)}">
      ${q.opcoes.map(o => `
        <button type="button" role="radio" aria-checked="${sel === o.id}" class="opcao ${sel === o.id ? 'sel' : ''}" data-id="${o.id}">

        </button>`).join('')}
    </div>`;
  $$('.opcao', vistaDiag).forEach(b => b.addEventListener('click', () => {
    if (fluxo.aAvancar) return;
    fluxo.respostas[q.id] = b.dataset.id;
    fluxo.aAvancar = true;
    renderPergunta();
    setTimeout(() => {
      if (!fluxo) return;
      fluxo.aAvancar = false;
      if (fluxo.qi < total - 1) { fluxo.qi++; renderPergunta(); }
      else { fluxo.passo = 'analise'; renderFluxo(); }
      window.scrollTo(0, 0);
    }, 320);
  }));
  const voltar = $('#fluxo-voltar');
  if (voltar) voltar.addEventListener('click', () => {
    if (fluxo.qi > 0) fluxo.qi--; else fluxo.passo = 'triagem';

function concluirFluxo() {
  const r = calcular(fluxo.respostas);
  const nenhuma = DATA.triagem.length - 1;
  const triagem = Array.from(fluxo.triagem);
  const flag = fluxo.modo === 'reavaliacao' && !(estado.diagnostico && estado.diagnostico.flagAlerta)
    ? false
    : triagem.some(i => i !== nenhuma);
  const novo = {
    data: hojeISO(), triagem, flagAlerta: flag,
    respostas: Object.assign({}, fluxo.respostas),
    pontos: r.pontos, principal: r.principal, secundario: r.secundario
  };
  if (fluxo.modo === 'reavaliacao') {
    const anterior = estado.diagnostico;
    const significativa = novo.principal !== anterior.principal || (anterior.pontos[anterior.principal] - novo.pontos[anterior.principal]) >= 4;
    resultadoReav = { anterior, novo, significativa };
    fluxo = null;
    renderDiagnostico();
  } else {
    estado.diagnostico = novo;
    estado.checks = {}; estado.notas = {};
    guardar();
    fluxo = null; semanaAtiva = 0;
    renderDiagnostico();
  }
  window.scrollTo(0, 0);
}

function htmlChecklistDia(perfil, dia) {
  const semana = perfil.semanas[semanaDoDia(dia)];
  const tarefa = tarefaDoDia(perfil, dia);
  const linha = (chave, titulo, passos, etiqueta) => {
    const k = `${dia}-${chave}`;
    return `
      <label class="check">
        <input type="checkbox" data-chave="${k}" ${estado.checks[k] ? 'checked' : ''}>
        <span class="caixa">${ICONE.check}</span>
        <span class="txt">
          ${etiqueta ? `<span class="etiqueta-tarefa">${esc(etiqueta)}</span><br>` : ''}
          <span class="t">${esc(titulo)}</span>
          ${passos.length ? `<ul>${passos.map(p => `<li>${inline(p)}</li>`).join('')}</ul>` : ''}
        </span>
      </label>`;
  };
  let html = '';
  if (tarefa) html += linha('tarefa', tarefa.titulo, tarefa.itens, `Tarefa do Dia ${dia}`);
  for (const g of semana.rotina) html += linha(g.chave, `Rotina · ${g.rotulo}`, g.passos, '');
  html += `
    <div class="notas-dia">
      <label for="nota-${dia}">Notas do Dia ${dia}</label>
      <textarea id="nota-${dia}" data-nota="${dia}" placeholder="Como estão as suas unhas hoje? Registe observações, sensações ou dúvidas.">${esc(estado.notas[dia] || '')}</textarea>
      <div class="guardado" data-guardado="${dia}"></div>
    </div>`;
  return html;
}

/** Liga checkboxes e notas de um contentor ao estado. */
function ligarChecklist(raiz) {
  $$('input[type=checkbox][data-chave]', raiz).forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) estado.checks[cb.dataset.chave] = true; else delete estado.checks[cb.dataset.chave];
    guardar();
    atualizarIndicadores();
  }));
  $$('textarea[data-nota]', raiz).forEach(ta => {
    let t;
    ta.addEventListener('input', () => {
      const dia = ta.dataset.nota;
      if (ta.value.trim()) estado.notas[dia] = ta.value; else delete estado.notas[dia];
      guardar();
      clearTimeout(t);
      $$(`[data-guardado="${dia}"]`).forEach(el => { el.textContent = 'Guardado'; });
      t = setTimeout(() => $$(`[data-guardado="${dia}"]`).forEach(el => { el.textContent = ''; }), 1400);
    });
  });
}

/** Atualiza percentagens, contadores e cores sem redesenhar a página. */
function atualizarIndicadores() {
  if (!estado.diagnostico) return;
  const g = progressoGeral();
  const pct = $('#pct-plano'); if (pct) pct.textContent = g.pct + '%';
  const barra = $('#barra-plano'); if (barra) barra.style.width = g.pct + '%';
  for (let d = 1; d <= 21; d++) {
    const p = progressoDia(d);
    const classe = p.feitos === p.total ? 'completo' : p.feitos ? 'parcial' : '';
    $$(`[data-num="${d}"]`).forEach(el => { el.className = `dia-num ${classe}`; });
    $$(`[data-cont="${d}"]`).forEach(el => { el.textContent = `${p.feitos} de ${p.total} concluídas`; });
    // sincroniza checkboxes visíveis noutras vistas
    $$(`input[data-chave^="${d}-"]`).forEach(cb => { cb.checked = !!estado.checks[cb.dataset.chave]; });
  }
  renderProgresso();
}

const veu = $('#veu'), folha = $('#folha');
function abrirDia(dia) {
  const perfil = perfilAtual();
  const t = tarefaDoDia(perfil, dia);
  folha.innerHTML = `
    <div class="pega"></div>
    <button class="fechar" type="button" aria-label="Fechar">${ICONE.fechar}</button>
    <div class="sobretitulo">${esc(perfil.semanas[semanaDoDia(dia)].titulo.replace(/\s*\(Dias.*\)$/, ''))}</div>
    <h2>Dia ${dia}${t ? ` · ${esc(t.titulo)}` : ''}</h2>
    <div class="cartao">${htmlChecklistDia(perfil, dia)}</div>`;
  ligarChecklist(folha);
  $('.fechar', folha).addEventListener('click', fecharFolha);
  veu.classList.add('aberto'); folha.classList.add('aberta');
}
function fecharFolha() {
  veu.classList.remove('aberto'); folha.classList.remove('aberta');
  renderProgresso();
  if (!fluxo && !resultadoReav) renderPlano(); // sincroniza notas escritas na folha
}
veu.addEventListener('click', fecharFolha);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && folha.classList.contains('aberta')) fecharFolha(); });

/* ==========================================================================
   ABA 3 — PERGUNTE À ESPECIALISTA
   ========================================================================== */
const vistaFaq = $('#view-especialista');
let categoriaAtiva = 'todos';
const INDICE = DATA.faq.map(f => ({
  f,
  tags: normalizar(f.tags.join(' ')),
  pergunta: normalizar(f.pergunta),
  resposta: normalizar(f.resposta)
}));

function montarEspecialista() {
  vistaFaq.innerHTML = `
    ${topo('Pergunte à Especialista')}
    <div class="pesquisa">
      <div class="campo-pesquisa">
        ${ICONE.pesquisa}
        <input type="search" id="pesquisa" placeholder="Ex.: verniz gel, cutícula, acetona" autocomplete="off" aria-label="Pesquisar dúvidas">
        <button type="button" class="limpar" id="limpar-pesquisa" aria-label="Limpar pesquisa">${ICONE.fechar}</button>
      </div>
      <div class="chips" role="tablist" aria-label="Categorias">
        ${CATEGORIAS.map(c => `<button type="button" class="chip ${c.id === categoriaAtiva ? 'ativo' : ''}" data-cat="${c.id}">${esc(c.rotulo)}</button>`).join('')}
      </div>
    </div>
    <div class="contagem" id="contagem" aria-live="polite"></div>
    <div id="resultados"></div>`;
  const input = $('#pesquisa');
  input.addEventListener('input', () => { $('#limpar-pesquisa').classList.toggle('visivel', !!input.value); filtrar(); });
  $('#limpar-pesquisa').addEventListener('click', () => { input.value = ''; $('#limpar-pesquisa').classList.remove('visivel'); filtrar(); input.focus(); });
  $$('.chip', vistaFaq).forEach(c => c.addEventListener('click', () => {
    categoriaAtiva = c.dataset.cat;
    $$('.chip', vistaFaq).forEach(x => x.classList.toggle('ativo', x === c));
    filtrar();
  }));
  filtrar();
}

function realcar(texto, termos) {
  let h = inline(texto);
  if (!termos.length) return h;
  // realce sem acentos: percorre o texto original e compara a versão normalizada
  const norm = normalizar(texto);
  const marcas = new Array(texto.length).fill(false);
  for (const t of termos) {
    let i = norm.indexOf(t);
    while (i !== -1) { for (let k = i; k < i + t.length; k++) marcas[k] = true; i = norm.indexOf(t, i + t.length); }
  }
  let out = '', dentro = false;
  for (let i = 0; i < texto.length; i++) {
    if (marcas[i] && !dentro) { out += '<mark>'; dentro = true; }
    if (!marcas[i] && dentro) { out += '</mark>'; dentro = false; }
    out += esc(texto[i]);
  }
  if (dentro) out += '</mark>';
  return out;
}

function filtrar() {
  const consulta = normalizar($('#pesquisa').value.trim());
  const termos = consulta.split(/\s+/).filter(t => t.length >= 2);
  const cat = CATEGORIAS.find(c => c.id === categoriaAtiva).valor;
  let lista = INDICE.filter(x => !cat || x.f.categoria === cat);
  if (termos.length) {
    lista = lista
      .map(x => {
        let pontos = 0, todos = true;
        for (const t of termos) {
          const nt = (x.tags.includes(t) ? 3 : 0) + (x.pergunta.includes(t) ? 2 : 0) + (x.resposta.includes(t) ? 1 : 0);
          if (!nt) { todos = false; break; }
          pontos += nt;
        }
        return { x, pontos: todos ? pontos : 0 };
      })
      .filter(r => r.pontos > 0)
      .sort((a, b) => b.pontos - a.pontos)
      .map(r => r.x);
  }
  $('#contagem').textContent = termos.length
    ? `${lista.length} ${lista.length === 1 ? 'resposta encontrada' : 'respostas encontradas'}`
    : `${lista.length} ${lista.length === 1 ? 'resposta' : 'respostas'} da especialista`;
  const res = $('#resultados');
  if (!lista.length) {
    res.innerHTML = `<div class="cartao vazio">${ICONE.vazio}<h3>Sem resultados</h3><p class="suave">Experimente outras palavras, como "lasca", "cutícula", "gel" ou "luvas", ou escolha a categoria "Todos".</p></div>`;
    return;
  }
  res.innerHTML = lista.map(({ f }) => `
    <details class="acordeao faq" ${termos.length && lista.length <= 2 ? 'open' : ''}>
      <summary>
        <span class="dia-info">
          <span class="cat">${esc(f.categoria)}</span><br>
          <span class="perg">${realcar(f.pergunta, termos)}</span>
        </span>
        ${ICONE.seta}
      </summary>
      <div class="corpo resposta">
        <div class="assinatura"><span class="avatar">${ICONE.especialista}</span><span><strong>Resposta da especialista</strong>Cuidados de unhas e pele</span></div>
        <div class="md">${md(f.resposta)}</div>
        ${f.alerta ? `<div class="aviso-medico">${ICONE.escudo}<span>Esta situação pode exigir avaliação médica. Em caso de dúvida, consulte um dermatologista.</span></div>` : ''}
        <div class="tags">${f.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </div>
    </details>`).join('');
}

/* ==========================================================================
   NAVEGAÇÃO
   ========================================================================== */
function mudarAba(aba) {
  $$('.view').forEach(v => v.classList.toggle('ativa', v.id === `view-${aba}`));
  $$('.nav button').forEach(b => {
    const ativo = b.dataset.aba === aba;
    b.classList.toggle('ativo', ativo);
    if (ativo) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}
$$('.nav button').forEach(b => b.addEventListener('click', () => {
  mudarAba(b.dataset.aba);
  if (b.dataset.aba === 'progresso') renderProgresso();
  window.scrollTo(0, 0);
}));

function renderTudo() {
  renderDiagnostico();
  renderProgresso();
}

instalarManifesto();
renderTudo();
montarEspecialista();
</script>
